<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" stroke="url(#novaGrad)" stroke-width="2.5" opacity="0.6" />
  <circle cx="50" cy="50" r="32" stroke="url(#novaGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
  <!-- Central 4-point star -->
  <path d="M50 14 C50 38, 38 50, 14 50 C38 50, 50 62, 50 86 C50 62, 62 50, 86 50 C62 50, 50 38, 50 14 Z" fill="url(#novaGrad)" filter="url(#glow)"/>
